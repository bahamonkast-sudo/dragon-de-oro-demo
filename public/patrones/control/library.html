<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia de Visionarios de Oro - Acción del Precio & Velas</title>
  
  <!-- Premium Typography and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-darker: #0d0f12;
      --bg-dark: #12151a;
      --bg-card: #181c24;
      --accent-gold: #ffd700;
      --accent-gold-dark: #d4af37;
      --success-green: #00b074;
      --alert-red: #ff4a4a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 215, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-darker);
      background-image: radial-gradient(circle at 50% 50%, #171d26 0%, #0c0e12 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-gold-dark);
      border-radius: 3px;
    }

    /* Header Nav Bar */
    header {
      background: rgba(15, 18, 25, 0.95);
      border-bottom: 2px solid rgba(212, 175, 55, 0.35);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
    }

    .back-button {
      background: linear-gradient(135deg, var(--alert-red), #991b1b);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-weight: 700;
      padding: 0.65rem 1.3rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(153, 27, 27, 0.4), inset 1px 1px 1px rgba(255,255,255,0.2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(239, 68, 68, 0.6);
    }

    .back-button:active {
      transform: translateY(0);
    }

    /* Main Dashboard Layout */
    .dashboard-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    /* Left Sidebar */
    .sidebar {
      width: 380px;
      min-width: 380px;
      background: rgba(18, 22, 30, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 5px 0 20px rgba(0, 0, 0, 0.4);
    }

    .sidebar-headline {
      font-family: 'Outfit', sans-serif;
      color: var(--accent-gold);
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      padding-bottom: 0.6rem;
      margin-bottom: 0.5rem;
    }

    .session-item {
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.01);
      overflow: hidden;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }

    .session-header {
      padding: 0.9rem 1.15rem;
      background: rgba(212, 175, 55, 0.03);
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.5px;
      transition: background 0.2s ease;
    }

    .session-header:hover {
      background: rgba(212, 175, 55, 0.08);
    }

    .concepts-list {
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      background: rgba(0, 0, 0, 0.25);
    }

    .concept-tab {
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .concept-tab:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .concept-tab.active {
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent-gold);
      border-left: 4px solid var(--accent-gold-dark);
      font-weight: 800;
      text-shadow: 0 0 4px rgba(255, 215, 0, 0.25);
    }

    /* Accordion Utility */
    .session-item.collapsed .concepts-list {
      display: none;
    }
    .session-item.collapsed .collapse-icon::before {
      content: "▶";
    }
    .session-item .collapse-icon::before {
      content: "▼";
    }

    /* Right Main Viewer */
    .main-viewer {
      flex: 1;
      padding: 3rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2.25rem;
    }

    .detail-display {
      width: 100%;
      max-width: 880px;
      background: rgba(18, 22, 28, 0.9);
      border: 2px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.75), inset 1px 1px 3px rgba(255,255,255,0.05);
    }

    .detail-svg-container {
      width: 100%;
      height: 390px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090b0e;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 1.5rem;
      box-shadow: inset 3px 3px 12px rgba(0, 0, 0, 0.85);
    }

    .detail-text {
      text-align: center;
      width: 100%;
    }

    .detail-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin-bottom: 0.85rem;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.35);
    }

    .detail-desc {
      font-size: 0.98rem;
      color: #e2e8f0;
      line-height: 1.65;
      padding: 0 1.5rem;
      max-width: 740px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Premium Top Header -->
  <header>
    <div class="brand-section">
      <img src="ui/golden_visionarios_logo.png" class="brand-logo" alt="Logo Visionarios de Oro">
      <h1 class="brand-title">ACADEMIA DE VISIONARIOS DE ORO</h1>
    </div>
    <button class="back-button" onclick="closeAcademy()">
      <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 20 20">
        <path d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"/>
      </svg>
      Volver a la Consola
    </button>
  </header>

  <!-- Dashboard -->
  <div class="dashboard-container">
    
    <!-- Sidebar Index Left -->
    <div class="sidebar">
      <div class="sidebar-headline">🎓 Temario y Sesiones</div>
      <div id="sessions-accordion-wrapper" style="display: flex; flex-direction: column; gap: 0.65rem;">
        <!-- Dynamically loaded from visionarios_knowledge.js -->
      </div>
    </div>

    <!-- Main Cinematic Viewer Right -->
    <div class="main-viewer">
      <div class="detail-display">
        <div class="detail-svg-container" id="view-screen-svg">
          <!-- Dynamic SVG diagram loaded here -->
        </div>
        <div class="detail-text">
          <h2 class="detail-name" id="view-screen-name">Cargando Academia...</h2>
          <p class="detail-desc" id="view-screen-desc">
            Cargando la base de conocimientos teóricos y visuales del Guardián Visionarios de Oro.
          </p>
        </div>
      </div>
    </div>

  </div>

  <!-- Loading script dynamically -->
  <script src="ui/components/visionarios_knowledge.js"></script>
  
  <script>
    // Navigation routing logic
    function closeAcademy() {
      // If opened in a blank tab, close it. Otherwise redirect to index.html
      if (window.opener || window.history.length === 1) {
        window.close();
      } else {
        window.location.href = "index.html";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Extract curriculum database from loaded window.VisionariosKnowledge module
      if (!window.VisionariosKnowledge) {
        console.error("No se pudo cargar la base de conocimientos de Acción del Precio.");
        return;
      }

      const sessions = [
        {
          id: 1,
          title: "SESIÓN 1: ESTRUCTURA Y CICLOS",
          subtitle: "Price Action Puro",
          concepts: [
            {
              name: "Tendencia Alcista",
              desc: "Sucesión armónica de máximos y mínimos cada vez más altos. Control comprador absoluto y dirección prioritaria alcista.",
              svg: `<!-- Grid Lines -->
                <svg viewBox="0 0 200 120" width="100%" height="100%">
                <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 2"/>
                <line x1="10" y1="60" x2="190" y2="60" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 2"/>
                <line x1="10" y1="20" x2="190" y2="20" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 2"/>
                <path d="M 20 100 L 60 70 L 50 85 L 100 50 L 90 65 L 140 30 L 130 45 L 180 15" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="3 2"/>
                <path d="M 20 100 L 60 70" fill="none" stroke="#00b074" stroke-width="3.5" marker-end="url(#arrow)"/>
                <path d="M 60 70 L 50 85" fill="none" stroke="#ff4a4a" stroke-width="2"/>
                <path d="M 50 85 L 100 50" fill="none" stroke="#00b074" stroke-width="3.5"/>
                <path d="M 100 50 L 90 65" fill="none" stroke="#ff4a4a" stroke-width="2"/>
                <path d="M 90 65 L 140 30" fill="none" stroke="#00b074" stroke-width="3.5"/>
                <path d="M 140 30 L 130 45" fill="none" stroke="#ff4a4a" stroke-width="2"/>
                <path d="M 130 45 L 180 15" fill="none" stroke="#00b074" stroke-width="3.5"/>
                <circle cx="50" cy="85" r="4" fill="#00b074"/>
                <text x="50" y="98" fill="#00b074" font-size="8" text-anchor="middle" font-family="monospace">HL (Mín Alto)</text>
                <circle cx="100" cy="50" r="4" fill="#ffd700"/>
                <text x="100" y="42" fill="#ffd700" font-size="8" text-anchor="middle" font-family="monospace">HH (Máx Alto)</text>
                </svg>`
            },
            {
              name: "Tendencia Bajista",
              desc: "Sucesión armónica de máximos y mínimos cada vez más bajos. Control vendedor dominante en el flujo de órdenes.",
              svg: `<svg viewBox="0 0 200 120" width="100%" height="100%">
                <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 2"/>
                <line x1="10" y1="60" x2="190" y2="60" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 2"/>

                <path d="M 50 35 L 100 70" fill="none" stroke="#ff4a4a" stroke-width="3.5"/>
                <path d="M 100 70 L 90 55" fill="none" stroke="#00b074" stroke-width="2"/>
                <path d="M 90 55 L 140 90" fill="none" stroke="#ff4a4a" stroke-width="3.5"/>

                <path d="M 130 75 L 180 105" fill="none" stroke="#ff4a4a" stroke-width="3.5"/>
                <circle cx="50" cy="35" r="4" fill="#ff4a4a"/>
                <text x="50" y="27" fill="#ff4a4a" font-size="8" text-anchor="middle" font-family="monospace">LH (Máx Bajo)</text>
                <circle cx="100" cy="70" r="4" fill="#ffd700"/>

                </svg>`
            },
            {
              name: "Acumulación / Rango",
              desc: "Precio encerrado horizontalmente entre un soporte y resistencia. Fuerzas en equilibrio temporal antes de una gran explosión.",
              svg: `<svg viewBox="0 0 200 120" width="100%" height="100%">
                <rect x="10" y="20" width="180" height="8" fill="rgba(255, 74, 74, 0.15)" stroke="#ff4a4a" stroke-width="1"/>
                <rect x="10" y="92" width="180" height="8" fill="rgba(0, 176, 116, 0.15)" stroke="#00b074" stroke-width="1"/>

                <circle cx="50" cy="28" r="3" fill="#ff4a4a"/>
                <circle cx="80" cy="92" r="3" fill="#00b074"/>
                </svg>`
            },
            {
              name: "Retroceso (Pullback)",
              desc: "Descanso corto o movimiento temporal en contra de la tendencia principal para buscar liquidez en zonas rotas.",
              svg: `<svg viewBox="0 0 200 120" width="100%" height="100%">
                <line x1="10" y1="60" x2="190" y2="60" stroke="#00b074" stroke-width="1.5" stroke-dasharray="4 2"/>

            {

                <line x1="20" y1="80" x2="150" y2="20" stroke="#00b074" stroke-width="1.5" stroke-dasharray="4 2"/>

                <text x="155" y="35" fill="#ff4a4a" font-size="8" text-anchor="middle" font-family="monospace">Quiebre Estructural</text>
                </svg>`
            }
          ]
        },
        {
          id: 2,
          title: "SESIÓN 2: ZONAS DE REACCIÓN",
          subtitle: "El precio tiene memoria",
          concepts: [
            {
              name: "Líneas de Soporte",
              desc: "Pisos del pasado donde la demanda supera a la oferta, deteniendo y rebotando la caída de las cotizaciones.",
              svg: `<svg viewBox="0 0 200 120" width="100%" height="100%">
                <path d="M 20 20 L 50 90 L 80 40 L 110 90 L 140 50 L 170 90 L 190 60" fill="none" stroke="#ffd700" stroke-width="2"/>

            {
              name: "Línea de Tendencia",

      // Bind dynamic rendering in DOM
      const container = document.getElementById("sessions-accordion-wrapper");
      const svgScreen = document.getElementById("view-screen-svg");
      const nameScreen = document.getElementById("view-screen-name");
      const descScreen = document.getElementById("view-screen-desc");

      function selectConcept(concept, element) {
        // Clear all previous actives
        document.querySelectorAll(".concept-tab").forEach(tab => tab.classList.remove("active"));
        element.classList.add("active");

        // Display contents
        svgScreen.innerHTML = concept.svg;
        nameScreen.innerText = concept.name.toUpperCase();
        descScreen.innerText = concept.desc;
      }

      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = "session-item collapsed";

        const header = document.createElement("div");
        header.className = "session-header";
        header.innerHTML = `
          <span>${sess.title} <span style="font-size: 0.65rem; color: var(--text-muted); font-weight: normal; margin-left: 4px;">(${sess.subtitle})</span></span>
          <span class="collapse-icon" style="font-size: 0.6rem;"></span>
        `;

        header.addEventListener("click", () => {
          const isCollapsed = item.classList.contains("collapsed");
          // Collapse all others
          document.querySelectorAll(".session-item").forEach(el => el.classList.add("collapsed"));
          
          if (isCollapsed) {
            item.classList.remove("collapsed");
          }
        });

        const list = document.createElement("div");
        list.className = "concepts-list";

        sess.concepts.forEach(concept => {
          const tab = document.createElement("div");
          tab.className = "concept-tab";
          tab.innerHTML = `🎓 ${concept.name}`;
          tab.addEventListener("click", (e) => {
            e.stopPropagation();
            selectConcept(concept, tab);
          });
          list.appendChild(tab);
        });

        item.appendChild(header);
        item.appendChild(list);
        container.appendChild(item);
      });

      // Render the very first concept on start
      const firstConcept = sessions[0].concepts[0];
      const firstSessionItem = container.querySelector(".session-item");
      if (firstSessionItem) {
        firstSessionItem.classList.remove("collapsed");
        const firstTab = firstSessionItem.querySelector(".concept-tab");
        if (firstTab) {
          selectConcept(firstConcept, firstTab);
        }
      }
    });
