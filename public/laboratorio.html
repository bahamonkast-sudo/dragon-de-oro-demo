<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Velas - Dragón de Oro</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .top-bar {
      height: 48px;
      background: #141824;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #232936;
      color: #fff;
      box-sizing: border-box;
    }
    .top-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .top-bar a.tab { color: #94a3b8; padding: 6px 12px; border-radius: 8px; border: 1px solid transparent; }
    .top-bar a.tab:hover { text-decoration: none; color: #fff; }
    .top-bar a.tab.active { color: #f59e0b; border-color: #f59e0b55; background: #f59e0b14; }
    .frame-container {
      width: 100%;
      height: calc(100% - 48px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div><strong>Laboratorio de Velas</strong> &bull; Dragón de Oro</div>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="tab active" id="tab-sim" href="patrones/velas/" target="lab-frame" onclick="cambiaTab('sim')">🎮 Simulador</a>
      <a class="tab" id="tab-nom" href="patrones/nombres-velas.html" target="lab-frame" onclick="cambiaTab('nom')">🕯️ Nombres de velas</a>
      <a href="curso.html">&larr; Volver al Curso</a>
    </div>
  </div>
  <div class="frame-container">
    <iframe name="lab-frame" id="lab-frame" src="patrones/velas/" title="Laboratorio de Velas - Dragón de Oro"></iframe>
  </div>
<script>
function cambiaTab(cual){
  document.getElementById('tab-sim').classList.toggle('active', cual==='sim');
  document.getElementById('tab-nom').classList.toggle('active', cual==='nom');
}
</script>
<script src="demo-vencido.js?v=2"></script>
</body>
</html>
