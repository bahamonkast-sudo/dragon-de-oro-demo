<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Velas - Dragón de Oro</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .top-bar {
      height: 48px;
      background: #141824;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #232936;
      color: #fff;
      box-sizing: border-box;
    }
    .top-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .top-bar a:hover {
      text-decoration: underline;
    }
    .frame-container {
      width: 100%;
      height: calc(100% - 48px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div><strong>Laboratorio de Velas</strong> &bull; Dragón de Oro</div>
    <a href="curso.html">&larr; Volver al Curso</a>
  </div>
  <div class="frame-container">
    <iframe src="patrones/velas/" title="Laboratorio de Velas - Dragón de Oro"></iframe>
  </div>
<script src="demo-vencido.js"></script>
</body>
</html>
